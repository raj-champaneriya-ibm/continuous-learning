[project]
name = "fde-first-principles"
version = "0.1.0"
description = "Daily first-principles AI learning notebooks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "requests",
    "ipykernel",
    "jupyterlab",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-bdd>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
