<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold">ADR-001 · Chosen design: B with a safety router and a policy check</text>

  <g stroke="#444" stroke-width="1.5">
    <rect x="60" y="55" width="360" height="50" rx="25" fill="#e8f0fe"/>
    <rect x="60" y="135" width="360" height="50" rx="6" fill="#f1f3f4"/>
    <rect x="60" y="215" width="360" height="60" rx="6" fill="#fde7e9"/>
    <rect x="60" y="305" width="360" height="50" rx="6" fill="#f1f3f4"/>
    <rect x="60" y="385" width="360" height="60" rx="6" fill="#e6f4ea"/>
    <rect x="60" y="475" width="360" height="60" rx="6" fill="#fde7e9"/>
    <rect x="60" y="565" width="360" height="60" rx="6" fill="#fff4e5"/>
    <rect x="60" y="655" width="360" height="45" rx="22" fill="#e8f0fe"/>
    <rect x="560" y="330" width="260" height="90" rx="6" fill="#fff4e5"/>
    <rect x="560" y="575" width="260" height="110" rx="6" fill="#ffffff" stroke-dasharray="5 4"/>
  </g>

  <g text-anchor="middle">
    <text x="240" y="85" font-weight="bold">Email in (about 1,200 a day)</text>
    <text x="240" y="158" font-weight="bold">Load customer card and outages</text>
    <text x="240" y="176" font-size="12">code, no model</text>
    <text x="240" y="240" font-weight="bold">Safety router: needs a human?</text>
    <text x="240" y="260" font-size="12">rules (OTP, injection, asks for a person) + 1 model call</text>
    <text x="240" y="328" font-weight="bold">Search the help articles</text>
    <text x="240" y="345" font-size="12">retrieved, not oracle context</text>
    <text x="240" y="410" font-weight="bold">One model call (version B)</text>
    <text x="240" y="430" font-size="12">drafts JSON: intent, reply, needs_human</text>
    <text x="240" y="500" font-weight="bold">Policy check</text>
    <text x="240" y="520" font-size="12">grader rules in code: OTP, password, credit limits</text>
    <text x="240" y="590" font-weight="bold">Human approves the draft</text>
    <text x="240" y="610" font-size="12">shadow mode until the gates hold</text>
    <text x="240" y="683" font-weight="bold">Reply out</text>
    <text x="690" y="360" font-weight="bold">Human support queue</text>
    <text x="690" y="380" font-size="12">a person writes the reply</text>
    <text x="690" y="398" font-size="12">over-escalating costs time, not safety</text>
  </g>

  <g font-size="12">
    <text x="575" y="598" font-weight="bold">Gates before replies go out unreviewed</text>
    <text x="575" y="620">0 policy breaks</text>
    <text x="575" y="638">at most 2 of 40 missed escalations</text>
    <text x="575" y="656">pass rate lower bound above A's 19%</text>
    <text x="575" y="674">measured on held-out cases, logged</text>
  </g>

  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="105" x2="240" y2="133"/>
    <line x1="240" y1="185" x2="240" y2="213"/>
    <line x1="240" y1="275" x2="240" y2="303"/>
    <line x1="240" y1="355" x2="240" y2="383"/>
    <line x1="240" y1="445" x2="240" y2="473"/>
    <line x1="240" y1="535" x2="240" y2="563"/>
    <line x1="240" y1="625" x2="240" y2="653"/>
    <polyline points="420,245 690,245 690,328"/>
    <polyline points="420,415 520,415 520,390 558,390"/>
    <polyline points="420,505 690,505 690,422"/>
  </g>

  <g font-size="12" fill="#b3261e" font-weight="bold">
    <text x="440" y="238">yes</text>
    <text x="440" y="408">needs_human</text>
    <text x="440" y="498">any break</text>
  </g>
  <g font-size="12" fill="#137333" font-weight="bold">
    <text x="250" y="294">no</text>
    <text x="250" y="554">clean</text>
  </g>
</svg>
